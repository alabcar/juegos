<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1b2e">
<title>¡A jugar!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
:root { --paper: #f3e6cf; --ink: #2a1b2e; --muted: #7a5f6e; --line: #2a1b2e; --shadow: #2a1b2e; --pix: "Pixelify Sans", ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root { --paper: #1a1220; --ink: #fff3dc; --muted: #b59aa8; --line: #fff3dc; --shadow: #000; color-scheme: dark; } }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--pix); -webkit-tap-highlight-color: transparent;
  background-image: linear-gradient(rgba(0,0,0,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.035) 2px, transparent 2px); background-size: 16px 16px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 24px; }
header { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "t l" "s s"; gap: 16px; align-items: center; }
header h1 { grid-area: t; }
header .langs { grid-area: l; align-self: start; }
.tele { grid-area: s; position: relative; margin: 0; width: 100%; max-width: 560px; border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); background: #e9b93c; line-height: 0; cursor: pointer; }
.tele canvas { display: block; width: 100%; height: auto; aspect-ratio: 128 / 80; image-rendering: pixelated; image-rendering: crisp-edges; }
.bocadillo { position: absolute; right: 4%; top: 7%; padding: 6px 10px; background: #fff; color: #2a1b2e; border: 3px solid #2a1b2e; font: 700 clamp(16px, 5vw, 26px)/1 var(--pix); box-shadow: 3px 3px 0 #2a1b2e; opacity: 0; transform: scale(.6); transform-origin: 0 100%; transition: opacity .08s steps(2), transform .12s steps(3); pointer-events: none; }
.bocadillo::after { content: ""; position: absolute; left: 10px; bottom: -12px; border: 6px solid transparent; border-top-color: #2a1b2e; border-right-color: #2a1b2e; }
.bocadillo.on { opacity: 1; transform: none; }
@media (min-width: 760px) { header { grid-template-columns: minmax(0, 520px) 1fr auto; grid-template-areas: "s t l"; gap: 28px; } }
h1 { margin: 0; font-weight: 700; font-size: clamp(40px, 11vw, 80px); line-height: .9; text-shadow: 4px 4px 0 #f2a46e; }
h1 span { color: #d9363e; }
.langs { display: flex; gap: 8px; }
.langs button { min-width: 46px; height: 46px; border: 3px solid var(--line); background: transparent; color: var(--ink); font: 700 14px var(--pix); cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.langs button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.game { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 16px; background: var(--bg); color: var(--fg); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); text-decoration: none; transition: transform .12s steps(2); }
.game:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow); }
.game:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--shadow); }
.game:focus-visible { outline: 3px dashed var(--acc); outline-offset: 4px; }
.game h2 { margin: 0; font-size: 32px; line-height: 1; text-shadow: 2px 2px 0 var(--acc); }
.game p { margin: 0; font-size: 16px; line-height: 1.3; }
.play { justify-self: start; padding: 6px 14px; background: var(--acc); color: var(--bg); font-weight: 700; font-size: 16px; border: 2px solid var(--fg); }
.empty { color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo">¡A <span>jugar</span>!</h1>
    <figure class="tele" title="¡A jugar!"><canvas id="plato" width="128" height="80" aria-hidden="true"></canvas><span class="bocadillo" id="bocadillo">¡A jugar!</span></figure>
    <div class="langs" role="group">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="va">VA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>
  <main class="shelf" id="shelf"></main>
</div>
<script>
(() => {
  try {
    if (/^(localhost|127\.|\[::1\])/.test(location.hostname)) return;
    const sc = document.createElement('script');
    sc.async = true;
    sc.dataset.goatcounter = 'https://alabcar.goatcounter.com/count';
    sc.src = 'https://gc.zgo.at/count.js';
    document.head.appendChild(sc);
  } catch (e) {}
})();
const T = {
  es: { pre: "¡A ", word: "jugar", post: "!", play: "Jugar", empty: "Pronto habrá juegos aquí." },
  va: { pre: "A ", word: "jugar", post: "!", play: "Jugar", empty: "Prompte hi haurà jocs ací." },
  en: { pre: "Let’s ", word: "play", post: "!", play: "Play", empty: "Games coming soon." }
};
let lang = "es";
let games = [];
let loaded = false;
try { lang = localStorage.getItem("lang") || ""; } catch (e) { lang = ""; }
if (lang === "ca") lang = "va";
if (!T[lang]) {
  const n = (navigator.language || "es").slice(0, 2).toLowerCase();
  lang = T[n] ? n : (n === "ca" ? "va" : "es");
}
function render() {
  document.documentElement.lang = lang === "va" ? "ca-valencia" : lang;
  const t = T[lang], h = document.getElementById("titulo"), w = document.createElement("span");
  w.textContent = t.word;
  h.replaceChildren(t.pre, w, t.post);
  document.getElementById("bocadillo").textContent = t.pre + t.word + t.post;
  document.title = t.pre + t.word + t.post;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const shelf = document.getElementById("shelf");
  shelf.textContent = "";
  const visible = games.filter(g => g.publicado === true);
  if (!visible.length) {
    if (!loaded) return;
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = T[lang].empty;
    shelf.append(p);
    return;
  }
  for (const g of visible) {
    const a = document.createElement("a");
    a.className = "game";
    a.href = g.url;
    a.style.setProperty("--bg", g.fondo || "#fff");
    a.style.setProperty("--fg", g.tinta || "#000");
    a.style.setProperty("--acc", g.acento || "#d9363e");
    const h = document.createElement("h2");
    h.textContent = g.nombre;
    const p = document.createElement("p");
    const d = g.descripcion || {};
    p.textContent = d[lang] || (lang === "va" && d.ca) || d.es || "";
    const s = document.createElement("span");
    s.className = "play";
    s.textContent = T[lang].play + " ▸";
    a.append(h, p, s);
    shelf.append(a);
  }
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}));
fetch("juegos.json", { cache: "no-store" })
  .then(r => r.json())
  .then(list => { games = Array.isArray(list) ? list : []; })
  .catch(() => {})
  .finally(() => { loaded = true; render(); });
render();
(() => {
  const cv = document.getElementById("plato");
  const bubble = document.getElementById("bocadillo");
  if (!cv || !cv.getContext) return;
  const W = 128, H = 80;
  const ctx = cv.getContext("2d");
  const C = {
    wall: "#e9b93c", wall2: "#dca934", ring: "#e2742a", ring2: "#f3cf5a", floor: "#c9862c",
    o: "#2a1b2e", suit: "#6e6684", suitD: "#554e6a", suitL: "#8a82a0",
    shirt: "#f4efe6", shirtD: "#cfc6c8", tie: "#7c1f2c", tieL: "#a3303f",
    s: "#dca07c", d: "#b97b5a", h: "#2c2426", g: "#8d8784", b: "#3b2a28", e: "#2a1b2e", w: "#ffffff", m: "#5a1a22",
    mic: "#3a3a42", micL: "#9a9aa6", card: "#fff06a", cardD: "#d8b72a"
  };
  let buf = new Array(W * H);
  const px = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; };
  const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); };
  const disc = (cx, cy, r, c) => { for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) px(x, y, c); };
  const stroke = (x0, y0, x1, y1, r, c) => { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2)); for (let k = 0; k <= n; k++) disc(x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n, r, c); };
  const line = (x0, y0, x1, y1, c) => { const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))); for (let k = 0; k <= n; k++) px(x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n, c); };
  const poly = (pts, c) => {
    let y0 = Infinity, y1 = -Infinity;
    pts.forEach(p => { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      const yc = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x < Math.round(xs[i + 1]); x++) px(x, y, c);
    }
  };
  const outlinePoly = (pts, c) => { for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; line(a[0], a[1], b[0], b[1], c); } };

  const HEAD = [
    "....ooooooo....",
    "...ohhhhhhho...",
    "..ohhhhhhhhho..",
    "..ohhsssssshho.",
    ".oghsssssssshgo",
    ".ogsssssssssgo.",
    ".osbbbsssbbbso.",
    "osswesssssewsso",
    "ossssssdssssso.",
    ".ossssdddssssso",
    ".ossssssssssso.",
    ".osssmmmmmssso.",
    "..ossssssssso..",
    "..odsssssssdo..",
    "...oddsssddo...",
    "....ooooooo...."
  ];
  const fixRow = r => (r + "...............").slice(0, 15);
  function head(x0, y0, blink, open) {
    const rows = HEAD.map(fixRow);
    rows[8] = "ossssssdsssssso";
    rows[9] = ".ossssdddsssso.";
    if (blink) rows[7] = "ossbbsssssbbsso";
    if (open) { rows[11] = ".ossmmmmmmmsso."; rows[12] = "..ossmmmmmsso.."; rows[13] = "..odssmmmssdo.."; }
    disc(x0 - 0.5, y0 + 8.5, 1.8, C.o); disc(x0 + 14.5, y0 + 8.5, 1.8, C.o);
    disc(x0 - 0.3, y0 + 8.5, 1, C.d); disc(x0 + 14.3, y0 + 8.5, 1, C.d);
    rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== ".") px(x0 + i, y0 + j, C[ch]); }));
    px(x0 + 5, y0 + 1, C.g); px(x0 + 6, y0 + 1, C.g); px(x0 + 9, y0 + 2, C.g);
  }

  function background() {
    buf.fill(C.wall);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if ((x + y) % 2 === 0 && y > 54) buf[y * W + x] = C.wall2;
    [[16, 6], [64, -2], [112, 6]].forEach(([cx, cy]) => {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
        if ((d > 30 && d < 32.2) || (d > 38 && d < 40.2)) buf[y * W + x] = C.ring;
        else if (d > 34.2 && d < 35.4) buf[y * W + x] = C.ring2;
      }
    });
    rect(0, 72, W, 8, C.floor);
    for (let x = 0; x < W; x += 4) px(x, 72, C.ring);
  }

  const SH = [49, 34], UP = 15, FO = 13;
  const POSES = [
    [100, 62], [124, 150], [163, 188], [198, 222], [214, 254], [222, 284], [150, 112], [116, 74]
  ];
  function gestureArm(a1, a2, wave) {
    const r = Math.PI / 180;
    const ex = SH[0] + Math.cos(a1 * r) * UP, ey = SH[1] + Math.sin(a1 * r) * UP;
    const hx = ex + Math.cos(a2 * r) * FO, hy = ey + Math.sin(a2 * r) * FO;
    stroke(SH[0], SH[1], ex, ey, 4.4, C.o);
    stroke(ex, ey, hx, hy, 3.6, C.o);
    stroke(SH[0], SH[1], ex, ey, 3.4, C.suit);
    stroke(ex, ey, hx, hy, 2.6, C.suit);
    stroke(SH[0] + 1, SH[1] - 1, ex + 1, ey - 1, 0.8, C.suitL);
    const cx = ex + Math.cos(a2 * r) * (FO - 2), cy = ey + Math.sin(a2 * r) * (FO - 2);
    disc(cx, cy, 2.6, C.shirt);
    const ang = a2 * r + (wave || 0);
    const ux = Math.cos(ang), uy = Math.sin(ang), vx = -uy, vy = ux;
    const kx = hx + ux * 2, ky = hy + uy * 2;
    const card = [[kx - vx * 4, ky - vy * 4], [kx + vx * 4, ky + vy * 4], [kx + vx * 4 + ux * 11, ky + vy * 4 + uy * 11], [kx - vx * 4 + ux * 11, ky - vy * 4 + uy * 11]];
    poly(card, C.card);
    outlinePoly(card, C.o);
    line(kx + ux * 3 - vx * 2, ky + uy * 3 - vy * 2, kx + ux * 3 + vx * 2, ky + uy * 3 + vy * 2, C.cardD);
    line(kx + ux * 5 - vx * 2, ky + uy * 5 - vy * 2, kx + ux * 5 + vx * 1, ky + uy * 5 + vy * 1, C.cardD);
    disc(hx, hy, 2.6, C.o);
    disc(hx, hy, 1.8, C.s);
    px(hx - 1, hy + 1, C.d);
  }

  function body() {
    const T = [[51, 29], [77, 29], [82, 33], [83, 80], [45, 80], [46, 33]];
    poly(T, C.suit);
    outlinePoly(T, C.o);
    poly([[47, 40], [52, 38], [53, 80], [46, 80]], C.suitD);
    poly([[81, 40], [76, 38], [75, 80], [82, 80]], C.suitD);
    poly([[60, 27], [68, 27], [64, 49]], C.shirt);
    line(60, 27, 63, 38, C.shirtD); line(68, 27, 65, 38, C.shirtD);
    poly([[63, 31], [65, 31], [66.5, 44], [64, 48], [61.5, 44]], C.tie);
    rect(62, 28, 4, 3, C.tie); px(63, 29, C.tieL); line(64, 33, 64, 42, C.tieL);
    poly([[55, 29], [60, 27], [64, 50], [59, 38]], C.suitL);
    poly([[73, 29], [68, 27], [64, 50], [69, 38]], C.suitL);
    line(60, 27, 64, 50, C.suitD); line(68, 27, 64, 50, C.suitD);
    line(55, 29, 59, 38, C.suitD); line(73, 29, 69, 38, C.suitD);
    line(59, 38, 64, 50, C.o); line(69, 38, 64, 50, C.o);
    poly([[72, 44], [78, 44], [77, 46], [75, 48], [73, 46]], C.tie);
    px(74, 44, C.tieL); px(76, 44, C.tieL);
    line(72, 47, 78, 47, C.suitD);
    disc(64, 58, 0.9, C.o); disc(64, 67, 0.9, C.o);
    rect(61, 23, 7, 5, C.d); rect(62, 23, 5, 3, C.s);
    line(58, 27, 61, 23, C.o); line(70, 27, 67, 23, C.o);
  }

  function micArm() {
    stroke(79, 34, 84, 52, 4.4, C.o);
    stroke(84, 52, 72, 37, 3.6, C.o);
    stroke(79, 34, 84, 52, 3.4, C.suit);
    stroke(84, 52, 72, 37, 2.6, C.suit);
    stroke(80, 34, 85, 50, 0.8, C.suitL);
    disc(74, 39, 2.4, C.shirt);
    stroke(69, 26, 71.5, 38, 1.4, C.o);
    stroke(69, 26, 71.5, 38, 0.6, C.mic);
    disc(68.5, 24.5, 2.6, C.o);
    disc(68.5, 24.5, 1.9, C.micL);
    px(68, 24, C.w); px(69, 25, C.mic); px(67, 25, C.mic);
    disc(71.5, 36, 2.6, C.o);
    disc(71.5, 36, 1.8, C.s);
    px(70, 37, C.d); px(72, 35, C.d);
  }

  let pose = 0, blink = false, open = false, wave = 0;
  function draw() {
    background();
    const p = POSES[pose];
    const behind = pose >= 2 && pose <= 5;
    body();
    if (behind) gestureArm(p[0], p[1], wave);
    head(57, 8, blink, open);
    micArm();
    if (!behind) gestureArm(p[0], p[1], wave);
    const img = ctx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const c = buf[i] || C.wall;
      img.data[i * 4] = parseInt(c.slice(1, 3), 16);
      img.data[i * 4 + 1] = parseInt(c.slice(3, 5), 16);
      img.data[i * 4 + 2] = parseInt(c.slice(5, 7), 16);
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  const SEQ = [[1, 90], [2, 90], [3, 90], [4, 120], [5, 140], [4, 140], [5, 140], [4, 140], [6, 100], [7, 100], [0, 0]];
  let busy = false, timer = 0;
  function gesture() {
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    let i = 0;
    const step = () => {
      const [p, ms] = SEQ[i];
      pose = p;
      open = p >= 3 && p <= 7;
      wave = p === 5 ? -0.35 : 0;
      if (p === 3) bubble.classList.add("on");
      if (p === 0) bubble.classList.remove("on");
      draw();
      i++;
      if (i < SEQ.length) setTimeout(step, ms);
      else { busy = false; schedule(); }
    };
    step();
  }
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function schedule() {
    clearTimeout(timer);
    if (still) return;
    timer = setTimeout(() => { if (document.hidden) schedule(); else gesture(); }, 3500 + Math.random() * 4500);
  }
  function blinker() {
    setTimeout(() => {
      if (!busy) { blink = true; draw(); setTimeout(() => { blink = false; if (!busy) draw(); }, 140); }
      blinker();
    }, 2200 + Math.random() * 3000);
  }
  cv.addEventListener("click", gesture);
  draw();
  if (!still) { setTimeout(gesture, 900); blinker(); }
  schedule();
})();
</script>
</body>
</html>
